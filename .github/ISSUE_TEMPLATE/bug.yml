name: Bug report
description: Report a reproducible defect or regression
title: "[Bug]: "
labels:
  - "type:bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the expected behavior.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Describe how the fix can be verified.
    validations:
      required: true
